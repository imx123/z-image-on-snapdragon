plugins { id "com.android.application"; id "org.jetbrains.kotlin.android" }

android { signingConfigs { debug { storeFile file("$rootDir/debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }
    namespace "com.example.zimage"; compileSdk 36; ndkVersion "28.0.13004108"
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
    defaultConfig { applicationId "com.example.zimage"; minSdk 30; targetSdk 36; versionCode 1; versionName "0.1"; externalNativeBuild { cmake { cppFlags "-std=c++17"; arguments "-DANDROID_NDK=C:/Users/Max/AppData/Local/Android/Sdk/ndk/28.0.13004108" } } }
    buildFeatures { buildConfig true; viewBinding true }
    sourceSets {
        main {
            // Supply Qualcomm libraries outside the repository when available.
            // Multi-GB QNN model libraries are deployed separately; keep APK JNI assets lightweight.
            jniLibs.srcDirs = [System.getenv("QNN_ANDROID_JNILIBS") ?: "${rootDir}/../build/android/apk-jniLibs"]
        }
    }
    externalNativeBuild { cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.31.6" } }
    packaging {
        jniLibs {
            // Never ship vendor libOpenCL*.so in the APK. QNN GPU must load
            // the system libOpenCL.so declared via <uses-native-library>; an
            // APK copy makes clGetPlatformIDs return -1001.
            excludes += "lib/**/libOpenCL*.so"
        }
    }
}
dependencies {
    // Google AI Edge / LiteRT GPU delegate probe. The delegate is the same
    // app-sandbox-safe GLES/EGL path used by google-ai-edge/gallery via its
    // tflite-gpu dependency, with optional dlopen of libOpenCL.
    implementation "com.google.ai.edge.litert:litert:1.4.2"
    implementation "com.google.ai.edge.litert:litert-gpu:1.4.2"
    // Material 3 UI (View system)
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.core:core-ktx:1.13.1"
}
